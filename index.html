<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Il Brief</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    /* Quiet-luxury palette: warm charcoal + a single champagne-gold accent.
       Type system: Cinzel (cinematic engraved serif) = brand voice (mark + name).
       Jost (sleek geometric sans) = the workhorse for clock, figures, and all UI. */
    :root { --bg:#0E0F11; --card:#16171A; --card-2:#1B1C20; --raise:#26272C; --text:#ECE7DD;
            --muted:#8B867B; --dim:#B7B1A5; --label:#8B867B; --teal:#CBB079; --teal-deep:#B0935A;
            --coral:#C08A5A; --red:#9E8B79; --amber:#CBB079; --line:rgba(220,210,190,0.07);
            --gold:#CBB079; --gold-soft:rgba(203,176,121,0.10);
            --title:'Cinzel', Georgia, 'Times New Roman', serif;
            --display:'Jost', -apple-system, 'Segoe UI', sans-serif;
            --sans:'Jost', -apple-system, 'Segoe UI', sans-serif; }
    * { box-sizing:border-box; margin:0; }
    input[type=checkbox] { accent-color:var(--gold); cursor:pointer; }
    body { background:var(--bg); color:var(--text);
           font:16px/1.6 -apple-system, "Segoe UI", Roboto, sans-serif; padding:28px; }
    .wrap { max-width:1040px; margin:0 auto; }

    .masthead { display:flex; justify-content:space-between; align-items:flex-end; gap:24px; }
    .mast-label { font-family:var(--title); font-size:12px; letter-spacing:3px; text-transform:uppercase; color:var(--gold); margin-bottom:12px; }
    h1#greeting { font-family:var(--title); font-size:40px; font-weight:500; letter-spacing:0.5px; line-height:1.06; }
    .sub { font-size:12px; letter-spacing:0.3px; color:var(--muted); margin-top:11px; }
    .mast-right { text-align:right; display:flex; flex-direction:column; align-items:flex-end; flex-shrink:0; }
    .clock { font-family:var(--display); font-size:54px; font-weight:300; line-height:0.85;
             letter-spacing:1px; color:var(--text); font-variant-numeric:tabular-nums; }
    .clock .colon { color:var(--gold); }
    .clock-loc { font-family:var(--sans); font-size:9px; letter-spacing:3.5px; text-transform:uppercase; color:var(--muted); margin-top:6px; }
    .countdown { background:var(--gold-soft); color:var(--gold);
                 border:1px solid rgba(203,176,121,0.24); border-radius:999px;
                 padding:6px 14px; font-size:11px; font-weight:500; letter-spacing:0.4px; white-space:nowrap; margin-top:13px; display:none; }
    .divider { height:1px; background:linear-gradient(90deg,rgba(203,176,121,0.28),var(--line) 40%,var(--line)); margin:22px 0 18px; }

    .tiles { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:16px; }
    .tile { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px 18px; }
    .tile .t-val { font-family:var(--display); font-size:32px; font-weight:500; line-height:1; margin-top:4px; }

    .grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; align-items:start; }
    .col { display:flex; flex-direction:column; gap:16px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px 20px; }
    .label { font-family:var(--sans); font-size:10px; letter-spacing:1.8px; color:var(--label); text-transform:uppercase; margin-bottom:10px; }

    .hero { background:var(--card-2); border-left:3px solid var(--teal-deep); border-radius:0 12px 12px 0; }
    .hero .label { color:var(--teal); }
    .hero #pulse-body { font-size:15px; line-height:1.65; }

    .terr { margin-top:14px; }
    .terr-row { display:flex; gap:18px; flex-wrap:wrap; align-items:flex-start; }
    .terr-map { flex:1 1 340px; min-width:280px; }
    .terr-map svg { width:100%; max-width:430px; display:block; margin:0 auto; }
    .terr-side { flex:1 1 240px; min-width:220px; }
    .legend { display:flex; gap:16px; justify-content:center; margin-top:6px; font-size:11px; color:var(--muted); }
    .legend span { display:inline-flex; align-items:center; gap:5px; }
    .legend i { width:8px; height:8px; border-radius:50%; display:inline-block; }
    .terr-hint { font-size:13px; color:var(--muted); line-height:1.6;
                 border:1px dashed var(--line); border-radius:10px; padding:14px; }

    .stale { background:#3A2E1E; color:var(--amber); border-radius:10px;
             padding:10px 14px; font-size:13px; margin-bottom:14px; display:none; }

    @media (max-width:760px) {
      body { padding:16px; }
      .grid { grid-template-columns:1fr; }
      .tiles { grid-template-columns:1fr 1fr; }
      .masthead { align-items:flex-start; gap:14px; }
      h1#greeting { font-size:27px; letter-spacing:0.3px; }
      .clock { font-size:38px; }
      .clock-loc { letter-spacing:2.5px; }
    }
    @keyframes pulse { 0%,100% { opacity:1 } 50% { opacity:0.4 } }
    .dot-ring { animation:pulse 2.4s ease-in-out infinite; }
    @keyframes blink { 50% { opacity:0.3 } }
    @keyframes rise { from { opacity:0; transform:translateY(10px) } to { opacity:1; transform:none } }
    .rise { animation:rise .5s cubic-bezier(.2,.7,.2,1) both; }
    @media (prefers-reduced-motion:reduce) { .rise,.dot-ring,.clock .colon { animation:none } }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="masthead rise" style="animation-delay:0s">
      <div class="mast-left">
        <div class="mast-label">Il Brief · la tua giornata</div>
        <h1 id="greeting">Buongiorno, Marcello</h1>
        <p class="sub" id="datestamp"></p>
      </div>
      <div class="mast-right">
        <div class="clock"><span id="ch">--</span><span class="colon">:</span><span id="cm">--</span></div>
        <div class="clock-loc">Adelaide</div>
        <div class="countdown" id="countdown"></div>
      </div>
    </div>
    <div class="divider"></div>

    <div id="stale" class="stale">Showing yesterday's brief — today's update hasn't arrived yet.</div>

    <div class="tiles rise" id="tiles" style="animation-delay:.06s"></div>

    <div class="grid rise" style="animation-delay:.12s">
      <div class="col">
        <div class="card hero" id="pulse"><div class="label">Market pulse</div><div id="pulse-body"></div></div>
        <div class="card" id="suburbs"><div class="label">My suburbs</div><div id="suburbs-body"></div></div>
        <div class="card" id="knowNumbers"><div class="label" style="display:flex;justify-content:space-between"><span>Know your numbers</span><span id="know-count" style="color:var(--muted);letter-spacing:0"></span></div><div id="know-body"></div></div>
      </div>
      <div class="col">
        <div class="card" id="myday" style="border-left:3px solid var(--amber);border-radius:0 12px 12px 0">
          <div class="label" style="color:var(--amber);display:flex;justify-content:space-between">
            <span>My day</span><span id="myday-count" style="color:var(--muted);letter-spacing:0"></span></div>
          <div id="myday-body"></div></div>
        <div class="card" id="frase" style="border-left:3px solid var(--teal-deep);border-radius:0 12px 12px 0">
          <div class="label" style="color:var(--teal)">La frase di oggi</div><div id="frase-body"></div></div>
        <div class="card" id="skill"><div class="label">Skill of the day</div><div id="skill-body"></div></div>
        <div class="card" id="content"><div class="label" style="display:flex;justify-content:space-between"><span>Content · post today?</span><span id="content-flag" style="color:var(--muted);letter-spacing:0"></span></div><div id="content-body"></div></div>
      </div>
    </div>

    <div class="card terr rise" id="territorio" style="animation-delay:.18s">
      <div class="label">Il Territorio</div>
      <div class="terr-row">
        <div class="terr-map">
          <div id="map-holder"></div>
          <div class="legend">
            <span><i style="background:var(--teal)"></i>new</span>
            <span><i style="background:var(--coral)"></i>auction</span>
            <span><i style="background:var(--red)"></i>sold</span>
          </div>
        </div>
        <div class="terr-side" id="detail-holder"></div>
      </div>
    </div>
  </div>

  <script>
  const $ = id => document.getElementById(id);
  const fmtDay = d => d.toLocaleDateString('en-AU', { weekday:'long', day:'numeric', month:'long', timeZone:'Australia/Adelaide' });
  const todayISO = () => new Date().toLocaleDateString('en-CA', { timeZone:'Australia/Adelaide' });
  const daysSinceEpoch = () => Math.floor(Date.parse(todayISO()) / 86400000);

  const TERR_HINT = '<div class="terr-hint">Tap a suburb on the map to see its median, days on market, and today’s activity.</div>';

  function tickClock() {
    const t = new Date().toLocaleTimeString('en-AU', { hour:'2-digit', minute:'2-digit', hour12:false, timeZone:'Australia/Adelaide' });
    const [h, m] = t.split(':');
    $('ch').textContent = h; $('cm').textContent = m;
  }
  tickClock(); setInterval(tickClock, 1000);

  async function load(name) {
    const r = await fetch(`data/${name}.json?v=${Date.now()}`);
    if (!r.ok) throw new Error(`${name}.json ${r.status}`);
    return r.json();
  }

  function renderHeader(brief) {
    const now = new Date();
    const hr = Number(now.toLocaleString('en-AU', { hour:'numeric', hour12:false, timeZone:'Australia/Adelaide' }));
    $('greeting').textContent = (hr < 12 ? 'Buongiorno' : hr < 18 ? 'Buon pomeriggio' : 'Buonasera') + ', Marcello';
    const upd = new Date(brief.generatedAt).toLocaleTimeString('en-AU',
      { hour:'numeric', minute:'2-digit', timeZone:'Australia/Adelaide' });
    $('datestamp').textContent = `${fmtDay(now)} · Adelaide · brief updated ${upd}`;
    if (brief.date !== todayISO()) $('stale').style.display = 'block';

    const days = Math.round((Date.parse('2026-07-01') - Date.parse(todayISO())) / 86400000);
    const c = $('countdown');
    if (days > 0) { c.textContent = `${days} ${days === 1 ? 'day' : 'days'} to 1 July`; c.style.display = 'block'; }
    else if (days === 0) { c.textContent = 'Day 1 — in bocca al lupo!'; c.style.display = 'block'; }
  }

  function renderTiles(config, brief) {
    const tot = config.suburbs.reduce((a, s) => {
      const c = (brief.suburbs[s.id] || {}).counts || {};
      a.new += c.new || 0; a.auction += c.auction || 0; return a;
    }, { new: 0, auction: 0 });
    const tile = (label, val, color) =>
      `<div class="tile"><div class="label" style="color:var(--muted)">${label}</div>
        <div class="t-val"${color ? ` style="color:${color}"` : ''}>${val}</div></div>`;
    $('tiles').innerHTML =
      tile('Cash rate', brief.metrics.cashRate) +
      tile('Clearance', brief.metrics.clearance, 'var(--teal)') +
      tile('New listings', tot.new, tot.new ? 'var(--teal)' : null) +
      tile('Auctions', tot.auction, tot.auction ? 'var(--coral)' : null);
  }

  function renderPulse(brief) { $('pulse-body').textContent = brief.marketPulse; }

  function renderSuburbs(config, brief) {
    const rows = config.suburbs.map(s => {
      const d = brief.suburbs[s.id] || { counts:{new:0,auction:0,sold:0}, lines:[] };
      const bits = [];
      if (d.counts.new) bits.push(`${d.counts.new} new`);
      if (d.counts.auction) bits.push(`${d.counts.auction} auction`);
      if (d.counts.sold) bits.push(`${d.counts.sold} sold`);
      return `<div style="display:flex;justify-content:space-between;font-size:14px;padding:6px 0;border-bottom:1px solid var(--line)">
        <span style="font-weight:${s.primary ? 700 : 600};color:var(--text)">${s.primary ? '★ ' : ''}${s.name}</span>
        <span style="font-weight:600;color:${bits.length ? 'var(--teal)' : 'var(--muted)'}">${bits.join(' · ') || 'quiet'}</span></div>`;
    });
    $('suburbs-body').innerHTML = rows.join('');
  }

  function renderMap(config, brief, stats) {
    const dotSpots = [[-14,-6],[16,2],[2,-16],[-2,10],[18,-10]];
    const tiles = config.suburbs.map(s => {
      const d = brief.suburbs[s.id] || { counts:{new:0,auction:0,sold:0}, lines:[] };
      const z = s.tile.size, t = s.tile;
      const colors = [...Array(d.counts.new).fill('var(--teal)'),
                      ...Array(d.counts.auction).fill('var(--coral)'),
                      ...Array(d.counts.sold).fill('var(--red)')].slice(0, 5);
      const active = colors.length > 0;
      const dots = colors.map((c, i) => {
        const [dx, dy] = dotSpots[i].map(v => v * z / 58);
        return `<circle class="dot-ring" cx="${dx}" cy="${dy}" r="${z/9+3}" fill="${c}" opacity="0.25"/>
                <circle cx="${dx}" cy="${dy}" r="${z/14+2}" fill="${c}"/>`;
      }).join('');
      const h = z * 0.55;
      const prim = s.primary;
      return `<g transform="translate(${t.x},${t.y})" style="cursor:pointer" onclick="showDetail('${s.id}')">
        ${prim ? `<ellipse cx="0" cy="${h*0.3}" rx="${z*1.25}" ry="${z*0.6}" fill="var(--teal-deep)" opacity="0.10"/>` : ''}
        <polygon points="-${z},${h*0.12} 0,${h} 0,${h+10} -${z},${h*0.12+10}" fill="#1A1D22"/>
        <polygon points="${z},${h*0.12} 0,${h} 0,${h+10} ${z},${h*0.12+10}" fill="#23262C"/>
        <polygon points="0,-${h} ${z},${h*0.12} 0,${h} -${z},${h*0.12}"
          fill="${prim ? 'var(--raise)' : (active ? '#22252B' : '#1A1D22')}"
          stroke="${prim ? 'var(--teal-deep)' : (active ? '#4A4E56' : '#34383F')}" stroke-width="${prim ? 2 : 1}"/>
        ${dots}
        <text x="0" y="${h+24}" text-anchor="middle" fill="${prim ? 'var(--text)' : (active ? 'var(--dim)' : '#76756F')}"
          font-size="${prim ? 11 : 9}" ${prim ? 'font-weight="500"' : ''}>${s.name}</text></g>`;
    });
    $('map-holder').innerHTML = `<svg viewBox="0 0 300 200">${tiles.join('')}</svg>`;
    $('detail-holder').innerHTML = TERR_HINT;
    window.__territorio = { config, brief, stats };
  }

  function showDetail(id) {
    const { config, brief, stats } = window.__territorio;
    const s = config.suburbs.find(x => x.id === id);
    const d = brief.suburbs[id] || { lines: [] };
    const w = (stats.suburbs || {})[id];
    const tg = { warm:['▲','var(--teal)'], steady:['▶','var(--muted)'], cool:['▼','var(--coral)'] }[w?.trend] || ['▶','var(--muted)'];
    $('detail-holder').innerHTML = `
      <div style="background:var(--raise);border:1px solid var(--teal-deep);border-radius:10px;padding:14px">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <span style="font-weight:500;font-size:15px">${s.primary ? '★ ' : ''}${s.name}</span>
          <span style="color:var(--muted);font-size:12px;cursor:pointer" onclick="$('detail-holder').innerHTML=TERR_HINT">✕</span></div>
        ${w ? `<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px;font-size:14px">
          <div><div class="label" style="color:var(--muted);margin-bottom:2px">Median</div>${w.median}</div>
          <div><div class="label" style="color:var(--muted);margin-bottom:2px">Days</div>${w.daysOnMarket}</div>
          <div><div class="label" style="color:var(--muted);margin-bottom:2px">Trend</div><span style="color:${tg[1]}">${tg[0]} ${w.trend}</span></div></div>
          <div style="font-size:12px;color:var(--dim);margin-top:8px">${w.note}</div>` : ''}
        <div style="font-size:13px;color:var(--dim);margin-top:10px;border-top:1px solid var(--line);padding-top:10px">
          ${d.lines.length ? d.lines.map(l => `● ${l}`).join('<br>') : 'Quiet day — no new activity.'}</div></div>`;
  }

  function renderRotation(italian, skills) {
    const n = daysSinceEpoch();
    const fr = italian.entries[n % italian.entries.length];
    $('frase-body').innerHTML = `<div style="font-family:var(--display);font-weight:400;font-size:20px;line-height:1.35;color:var(--text)">«${fr.it}»</div>
      <div style="font-size:13px;color:var(--muted);margin-top:6px">${fr.en}</div>
      <div style="font-size:12px;color:var(--dim);margin-top:9px">${fr.drill}</div>`;
    const sk = skills.entries[n % skills.entries.length];
    $('skill-body').innerHTML = `<div style="font-weight:500;font-size:14px">${sk.title}</div>
      <div style="font-size:13px;color:var(--dim);margin-top:5px">${sk.body}</div>`;
  }

  function renderMyDay() {
    const KEY = 'brief-v1';
    let state;
    try { state = JSON.parse(localStorage.getItem(KEY)) || {}; } catch { state = {}; }
    if (state.date !== todayISO()) state = { date: todayISO(), tasks: (state.tasks || []).map(t => ({ ...t, done:false })) };
    if (!state.tasks) state.tasks = [];
    const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch {} };
    const draw = () => {
      const done = state.tasks.filter(t => t.done).length;
      $('myday-count').textContent = state.tasks.length ? `${done}/${state.tasks.length} done` : '';
      $('myday-body').innerHTML = state.tasks.map((t, i) =>
        `<label style="display:flex;gap:8px;font-size:14px;padding:3px 0;${t.done ? 'color:var(--muted);text-decoration:line-through' : ''}">
          <input type="checkbox" ${t.done ? 'checked' : ''} onchange="__toggleTask(${i})"> ${t.text}</label>`).join('') +
        `<form onsubmit="return __addTask(this)" style="margin-top:8px;display:flex;gap:6px">
          <input name="t" placeholder="Add a task…" style="flex:1;background:var(--bg);border:1px solid #34383F;border-radius:8px;color:var(--text);padding:6px 10px;font-size:13px">
          <button style="background:var(--raise);border:1px solid #34383F;border-radius:8px;color:var(--text);padding:6px 12px;cursor:pointer">+</button></form>`;
    };
    window.__toggleTask = i => { state.tasks[i].done = !state.tasks[i].done; save(); draw(); };
    window.__addTask = f => { const v = f.t.value.trim(); if (v) { state.tasks.push({ text:v, done:false }); save(); draw(); } return false; };
    save(); draw();
  }

  // Daily flashcard deck: 5 suburb-numbers cards. Reveal → Next → …gold tick when all 5 are done.
  function renderKnowNumbers(config, stats) {
    const all = config.suburbs;
    const deckLen = Math.min(5, all.length);
    const start = daysSinceEpoch() % all.length;
    const deck = Array.from({ length: deckLen }, (_, i) => all[(start + i) % all.length]);
    const KEY = 'know-v1';
    let done = 0;
    try { const st = JSON.parse(localStorage.getItem(KEY) || '{}'); if (st.date === todayISO()) done = Math.min(st.done || 0, deckLen); } catch {}
    const save = () => { try { localStorage.setItem(KEY, JSON.stringify({ date: todayISO(), done })); } catch {} };
    const btnStyle = 'margin-top:12px;background:var(--raise);border:1px solid var(--line);border-radius:8px;color:var(--gold);padding:7px 14px;cursor:pointer;font-family:var(--sans);font-size:11px;letter-spacing:1.5px;text-transform:uppercase';

    const drawDone = () => {
      $('know-count').textContent = `${deckLen} / ${deckLen}`;
      $('know-count').style.color = 'var(--gold)';
      $('know-body').innerHTML = `
        <div style="display:flex;align-items:center;gap:12px;padding:6px 0">
          <span style="color:var(--gold);font-size:24px;line-height:1">✓</span>
          <div>
            <div style="font-family:var(--title);font-size:20px;font-weight:500;letter-spacing:0.5px">Completed</div>
            <div style="font-size:13px;color:var(--muted);margin-top:2px">${deckLen} suburbs refreshed today. Back tomorrow.</div>
          </div>
        </div>`;
    };

    const drawCard = () => {
      const s = deck[done];
      const w = (stats.suburbs || {})[s.id];
      $('know-count').textContent = `${done + 1} / ${deckLen}`;
      $('know-count').style.color = 'var(--muted)';
      const nextLabel = (done + 1 >= deckLen) ? 'Finish ✓' : 'Next card →';
      if (!w) {
        $('know-body').innerHTML = `<div style="font-family:var(--title);font-size:22px;font-weight:500">${s.name}</div>
          <div style="font-size:13px;color:var(--muted);margin-top:6px">No numbers for this one yet.</div>
          <button onclick="__knowNext()" style="${btnStyle}">${nextLabel}</button>`;
        return;
      }
      const tg = { warm:['▲','var(--teal)'], steady:['▶','var(--muted)'], cool:['▼','var(--coral)'] }[w.trend] || ['▶','var(--muted)'];
      $('know-body').innerHTML = `
        <div style="font-family:var(--title);font-size:22px;font-weight:500;letter-spacing:0.5px">${s.name}</div>
        <div style="font-size:13px;color:var(--muted);margin-top:4px">Median? Days on market? Say it aloud — then check.</div>
        <div id="know-answer" onclick="__knowReveal()" style="margin-top:12px;filter:blur(7px);opacity:.55;transition:filter .3s,opacity .3s;cursor:pointer">
          <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;font-size:15px">
            <div><div class="label" style="color:var(--muted);margin-bottom:2px">Median</div>${w.median}</div>
            <div><div class="label" style="color:var(--muted);margin-bottom:2px">Days</div>${w.daysOnMarket}</div>
            <div><div class="label" style="color:var(--muted);margin-bottom:2px">Trend</div><span style="color:${tg[1]}">${tg[0]} ${w.trend}</span></div>
          </div>
          <div style="font-size:12px;color:var(--dim);margin-top:8px">${w.note}</div>
        </div>
        <button id="know-btn" onclick="__knowReveal()" style="${btnStyle}">Reveal answer</button>`;
    };

    window.__knowReveal = () => {
      const a = $('know-answer'); if (a) { a.style.filter = 'none'; a.style.opacity = '1'; a.style.cursor = 'default'; }
      const b = $('know-btn'); if (b) { b.textContent = (done + 1 >= deckLen) ? 'Finish ✓' : 'Next card →'; b.setAttribute('onclick', '__knowNext()'); }
    };
    window.__knowNext = () => { done++; save(); if (done >= deckLen) drawDone(); else drawCard(); };

    if (done >= deckLen) drawDone(); else drawCard();
  }

  // Lightweight content nudge: one rotating idea + a "posted today" tick.
  const CONTENT_IDEAS = [
    'Film a 30-sec walkthrough of one standout feature in a current listing.',
    'Share a just-sold result with the one-line story behind the price.',
    '“What $900k buys in Athelstone vs Norwood” — a quick side-by-side.',
    'Market-minute: this week’s Adelaide clearance rate + what it means for sellers.',
    'Introduce yourself in Italian and English — the community will share it.',
    'Bust one myth about selling in winter.',
    'Behind-the-scenes: prepping a home the morning of an open.',
    'Answer a FAQ: “How long does settlement actually take in SA?”',
    'Spotlight a local deli or café your Italian-belt clients love.',
    'Your 30-second “why I got into real estate” story.',
    'A gentle tip for downsizers thinking about the next chapter.',
    'Before/after of a room that styling transformed.',
    'This weekend’s opens in your suburbs — one saveable post.',
    'A 5-star client moment (with their permission).',
    'Reel: 3 things buyers always miss on a first inspection.',
    '“Should I sell before I buy?” — the honest 60-second answer.',
    'Poll your audience: modern build or full-of-character character home?',
    'A day-in-the-life: what your agent actually does between listing and sold.',
    'Explain auction vs private treaty in plain English for SA sellers.',
    'One under-rated street in your farm area — and why buyers love it.',
    'Quick reno ROI: the 3 cheapest changes that lift a sale price.',
    'Rapid-fire: 5 questions to ask before you pick an agent.',
    'Local guide: best coffee, parks and schools in one of your suburbs.',
    'Interest-rate check-in: what today’s move means for buyers this month.',
  ];
  function renderContent() {
    const KEY = 'content-posted';
    let posted = false;
    try { posted = localStorage.getItem(KEY) === todayISO(); } catch {}
    let i = daysSinceEpoch() % CONTENT_IDEAS.length;
    const arrow = 'cursor:pointer;color:var(--gold);font-size:16px;line-height:1;padding:0 4px;user-select:none';
    const draw = () => {
      $('content-flag').innerHTML =
        `<span onclick="__contentNav(-1)" style="${arrow}">‹</span>` +
        `<span style="color:var(--muted);font-size:11px">${i + 1}/${CONTENT_IDEAS.length}</span>` +
        `<span onclick="__contentNav(1)" style="${arrow}">›</span>` +
        (posted ? `<span style="color:var(--gold);margin-left:8px">✓</span>` : '');
      $('content-body').innerHTML = `
        <div style="font-size:14px;line-height:1.5;color:var(--text)">${CONTENT_IDEAS[i]}</div>
        <label style="display:inline-flex;align-items:center;gap:8px;margin-top:11px;font-size:13px;color:${posted ? 'var(--gold)' : 'var(--muted)'};cursor:pointer">
          <input type="checkbox" ${posted ? 'checked' : ''} onchange="__togglePosted()"> ${posted ? 'Posted today' : 'Mark as posted'}</label>`;
    };
    window.__contentNav = (d) => { i = (i + d + CONTENT_IDEAS.length) % CONTENT_IDEAS.length; draw(); };
    window.__togglePosted = () => {
      posted = !posted;
      try { posted ? localStorage.setItem(KEY, todayISO()) : localStorage.removeItem(KEY); } catch {}
      draw();
    };
    draw();
  }

  async function init() {
    const [config, brief, stats, italian, skills] = await Promise.all(
      ['config','brief','stats','italian','skills'].map(load));
    renderHeader(brief);
    renderTiles(config, brief);
    renderPulse(brief);
    renderSuburbs(config, brief);
    renderMap(config, brief, stats);
    renderRotation(italian, skills);
    renderKnowNumbers(config, stats);
    renderContent();
    renderMyDay();
  }
  init().catch(e => { $('stale').style.display = 'block'; $('stale').textContent = 'Could not load brief data: ' + e.message; });
  </script>
</body>
</html>
